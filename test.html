<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Image Upload</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .box { padding: 30px; border: 2px dashed #888; border-radius: 10px; margin: 20px 0; cursor: pointer; }
        .box:hover { background: #f0f0f0; }
        #log { background: #111; color: #0f0; padding: 15px; font-family: monospace; font-size: 13px; white-space: pre-wrap; border-radius: 8px; max-height: 400px; overflow-y: auto; }
        #preview { display: flex; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        #preview img { width: 120px; height: 120px; object-fit: cover; border: 2px solid green; border-radius: 8px; }
        h1 { color: #166534; }
    </style>
</head>
<body>
    <h1>Image Upload Test</h1>
    <p>I-click ang box sa ibaba at pumili ng image (JPG, PNG, GIF, etc.)</p>

    <div class="box" id="uploadBox">
        <p style="text-align:center; font-size:18px;">📁 Click to select file</p>
        <input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
    </div>

    <div id="preview"></div>
    <div id="log">Waiting for file...</div>

    <script>
        const box = document.getElementById('uploadBox');
        const input = document.getElementById('fileInput');
        const log = document.getElementById('log');
        const preview = document.getElementById('preview');

        function write(msg) {
            log.textContent += '\n' + msg;
            log.scrollTop = log.scrollHeight;
        }

        log.textContent = 'Script loaded. Click the box above.';

        box.onclick = () => {
            write('Box clicked - opening file picker');
            input.click();
        };

        input.onchange = (e) => {
            const files = e.target.files;
            write('Change event fired! Files: ' + files.length);

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                write('---');
                write('File ' + (i+1) + ':');
                write('  Name: ' + file.name);
                write('  Type: ' + (file.type || '(empty)'));
                write('  Size: ' + file.size + ' bytes');
                write('  Extension: ' + (file.name.split('.').pop() || '(none)'));

                const reader = new FileReader();
                reader.onload = (ev) => {
                    write('  ✅ Read OK. Data length: ' + ev.target.result.length);
                    const img = document.createElement('img');
                    img.src = ev.target.result;
                    img.onload = () => write('  ✅ Image decoded! ' + img.width + 'x' + img.height);
                    img.onerror = () => write('  ❌ Image cannot be decoded by browser');
                    preview.appendChild(img);
                };
                reader.onerror = () => write('  ❌ FileReader error: ' + reader.error);
                reader.readAsDataURL(file);
            }
        };
    </script>
</body>
</html>
