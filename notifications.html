<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#166534">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SJC Lost & Found">
    <meta name="msapplication-TileColor" content="#166534">
    <meta name="msapplication-tap-highlight" content="no">
    <title>Notifications | SJC Campus Lost &amp; Found</title>
    <script>
    (function () {
        try {
            var raw = localStorage.getItem('pocketbase_auth');
            if (!raw) return;
            var data = JSON.parse(raw);
            var rec = data.record || data.model;
            if (rec && rec.role === 'admin') {
                document.documentElement.classList.add('is-admin');
                var style = document.createElement('style');
                style.textContent =
                    '.nav-links a[href="report.html"], .nav-links a[href="index.html"] { display: none !important; }';
                document.head.appendChild(style);
            }
        } catch (e) { }
    })();
    </script>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/notifications.css">
    <script type="module" src="/src/notifications.ts"></script>
</head>
<body>
    <header>
        <a href="index.html" class="brand">
            <span class="sjc-logo">SJC</span>
            <span class="brand-copy">
                <strong>Campus Lost &amp; Found</strong>
                <small>Saint Jude College Manila</small>
            </span>
        </a>

        <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Open navigation" aria-controls="navLinks" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <nav aria-label="Main navigation">
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="items.html">Lost &amp; Found</a></li>
                <li><a href="report.html" data-require-auth>Report</a></li>
                <li id="navAuth"></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h2>Notifications</h2>
            <p>Mga update tungkol sa iyong mga reports</p>
        </div>

        <div class="notif-toolbar">
            <span id="notifCount" class="notif-count">0 notifications</span>
            <button id="markAllReadBtn" class="notif-action-btn" type="button">Mark all as read</button>
        </div>

        <section id="notifList" class="notif-list">
            <div class="empty-state">
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 SJC Campus Lost &amp; Found. All rights reserved.</p></footer>

    <div class="modal" id="authModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
        <div class="modal-content">
            <button class="close-btn" id="closeAuthBtn" type="button" aria-label="Close dialog">&times;</button>
            <div class="modal-intro">
                <span class="modal-logo">SJC</span>
                <div>
                    <h2 id="modalTitle">Welcome back</h2>
                    <p id="modalSubtitle">Sign in to manage your reports.</p>
                </div>
            </div>
            <div class="auth-message" id="authMessage" role="alert"></div>
            <div class="auth-tabs">
                <button class="auth-tab active" id="signinTab" type="button" data-auth-tab="signin">Sign In</button>
                <button class="auth-tab" id="signupTab" type="button" data-auth-tab="signup">Sign Up</button>
            </div>
            <form id="signinForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="signinEmail">PHINMAEd Email</label>
                    <input id="signinEmail" type="email" placeholder="name@phinmaed.com" required>
                </div>
                <div class="form-group">
                    <label for="signinPassword">Password</label>
                    <div class="password-wrapper">
                        <input id="signinPassword" type="password" placeholder="Enter your password" required>
                        <button class="toggle-password" type="button" data-toggle-password="signinPassword">Show</button>
                    </div>
                </div>
                <button class="submit-button" type="submit">Sign In</button>
                <p class="form-footer">
                    Can't sign in?
                    <button type="button" class="inline-button" data-auth-tab="signup">Create an account</button>
                </p>
            </form>
            <form id="signupForm" class="auth-form" hidden novalidate>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input id="signupName" type="text" placeholder="Juan Dela Cruz" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">PHINMAEd Email</label>
                    <input id="signupEmail" type="email" placeholder="name@phinmaed.com" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="password-wrapper">
                        <input id="signupPassword" type="password" placeholder="Create a password" required>
                        <button class="toggle-password" type="button" data-toggle-password="signupPassword">Show</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input id="signupConfirmPassword" type="password" placeholder="Re-enter your password" required>
                </div>
                <button class="submit-button" type="submit">Create Account</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</body>
</html>
