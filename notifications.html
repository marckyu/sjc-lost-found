<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#166534">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SJC Lost & Found">
    <meta name="msapplication-TileColor" content="#166534">
    <meta name="msapplication-tap-highlight" content="no">
    <title>Notifications | SJC Campus Lost &amp; Found</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/sjc-logo-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/sjc-logo-512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/sjc-logo-192.png">
    <link rel="manifest" href="/manifest.json">
    <script>
    (function () {
        try {
            var raw = localStorage.getItem('pocketbase_auth');
            if (!raw) return;
            var data = JSON.parse(raw);
            var rec = data.record || data.model;
            if (rec && rec.role === 'admin') {
                document.documentElement.classList.add('is-admin');
                var style = document.createElement('style');
                style.textContent =
                    '.nav-links a[href="report.html"], .nav-links a[href="index.html"] { display: none !important; }';
                document.head.appendChild(style);
            }
        } catch (e) { }
    })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.css">
    <script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.2/dist/cropper.min.js"></script>
    <link rel="stylesheet" href="/notifications.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script type="module" src="/src/notifications.ts"></script>
</head>
<body>
    <header>
        <a href="index.html" class="brand">
            <span class="sjc-logo"><img src="/sjc-logo.png" alt="SJC Logo"></span>
            <span class="brand-copy">
                <strong>Campus Lost &amp; Found</strong>
                <small>Saint Jude College Manila</small>
            </span>
        </a>

        <button class="hamburger" id="hamburgerBtn" type="button" aria-label="Open navigation" aria-controls="navLinks" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <nav aria-label="Main navigation">
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="items.html">Lost &amp; Found</a></li>
                <li><a href="report.html" data-require-auth>Report</a></li>
                <li id="navAdminLink"></li>
                <li id="navAuth"></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h2>Notifications</h2>
            <p>Updates about your reports</p>
        </div>

        <div class="notif-toolbar">
            <span id="notifCount" class="notif-count">0 notifications</span>
            <button id="markAllReadBtn" class="notif-action-btn" type="button">Mark all as read</button>
        </div>

        <section id="notifList" class="notif-list">
            <div class="empty-state">
                <p>Loading...</p>
            </div>
        </section>
    </main>

    <footer><p>&copy; 2026 SJC Campus Lost &amp; Found. All rights reserved.</p></footer>

    <div class="modal" id="avatarModal" role="dialog" aria-modal="true" aria-labelledby="avatarTitle" hidden>
        <div class="modal-content avatar-modal-content">
            <button class="close-btn" id="closeAvatarBtn" type="button" aria-label="Close dialog">&times;</button>
            <div class="avatar-modal-header">
                <div class="avatar-modal-title-wrap">
                    <span class="modal-logo"><img src="/sjc-logo.png" alt="SJC Logo"></span>
                    <div>
                        <h2 id="avatarTitle">Change Profile Picture</h2>
                        <p>Upload and crop your photo (max 5MB).</p>
                    </div>
                </div>
            </div>

            <div class="avatar-modal-body">
                <div id="avatarPreviewStage">
                    <div id="avatarPreview" class="avatar-preview"></div>
                    <input type="file" id="avatarInput" accept="image/*" hidden>
                    <div class="avatar-actions">
                        <button class="av-btn av-btn-outline" id="avatarChooseBtn" type="button">Choose Photo</button>
                        <button class="av-btn av-btn-danger" id="avatarRemoveBtn" type="button">Remove</button>
                    </div>
                    <div class="avatar-actions">
                        <button class="av-btn av-btn-outline" type="button" data-close-avatar>Cancel</button>
                        <button class="av-btn av-btn-solid" id="avatarSaveBtn" type="button">Save</button>
                    </div>
                </div>

                <div id="avatarCropArea" hidden>
                    <div class="avatar-crop-wrapper">
                        <img id="avatarCropImage" src="" alt="Crop">
                    </div>
                    <div class="avatar-actions">
                        <button class="av-btn av-btn-outline" id="avatarCancelCrop" type="button">Back</button>
                        <button class="av-btn av-btn-solid" id="avatarApplyCrop" type="button">Apply Crop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
</body>
</html>
